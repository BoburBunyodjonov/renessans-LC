name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/school_test?schema=public
  AUTH_SECRET: ci-secret-0000000000000000000000000000000000=
  NEXTAUTH_URL: http://localhost:3210
  NEXT_PUBLIC_SITE_URL: http://localhost:3210
  IP_SALT: ci-salt
  SEED_ADMIN_EMAIL: admin@school.uz
  SEED_ADMIN_PASSWORD: ChangeMe123!
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  # Fast feedback: everything that needs neither a database nor a browser.
  static:
    name: Types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm check:messages

  # The full stack: migrate, seed, build, then drive the app in a browser.
  e2e:
    name: Build and end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: school_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations and seed
        run: |
          pnpm db:deploy
          pnpm db:seed

      - name: Verify translations cover the seeded content
        run: pnpm check:i18n

      - run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e
        env:
          E2E_PORT: '3210'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
